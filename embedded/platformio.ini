; Drone embedded firmware
;
; Two environments share the same src/ tree:
;   - esp32doit-devkit-v1  classic ESP32, used for skeleton development today
;   - esp32-s3-devkitc-1   ESP32-S3, target production board (when it lands)
;
; Pin maps and board-specific code branch on the BOARD_* defines below.
; Everything else (FSM, comms, tests) is shared.
;
; Useful commands (run from this directory):
;   pio run                                   build the default env
;   pio run -e esp32doit-devkit-v1 -t upload  flash classic ESP32
;   pio device monitor                        open serial monitor
;   pio test -e esp32doit-devkit-v1           run on-target unit tests
;
; Note for this machine: there are two PlatformIO installs. Use
;   ~/.platformio/penv/bin/pio
; explicitly if `pio` on $PATH resolves to the old 4.3.4 (which fails).

[platformio]
; Production deploy board is the default so the VS Code PlatformIO
; toolbar (Build / Upload) targets it without an explicit env switch.
; Override per-build with `-e <env>` on the CLI, or the env switcher
; in the VS Code status bar.
default_envs = esp32s3wroom1

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_CLASSIC
lib_deps =
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.0
    ; ServoBus.cpp pulls SCServo.h for the SCSCL member, even though
    ; the classic dev board has no servo hardware. Lib gets dead-code
    ; eliminated if unused.
    https://github.com/workloads/scservo.git

[env:esp32s3wroom1]
platform = espressif32
board = esp32s3wroom1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3
    ; Override board JSON: board exposes only CP210x (no native USB-CDC
    ; endpoint), so route Serial back to UART0 HardwareSerial instead.
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; TEMPORARY — disable battery guard while the R18/R19 divider
    ; rework is pending (see hw-battery-divider-saturation memory).
    ; The ADC currently can't read above ~9 V so the protection is
    ; non-functional anyway; this prevents false-trip scenarios while
    ; we're testing on the bench with HW that's still being assembled.
    ; Remove this line once the HW team confirms the divider is fixed.
    -DDISABLE_BATTERY_MONITOR
upload_speed = 115200
; Pin the upload port to the CP210x adapter by its stable by-id path.
; Without this, PIO's auto-detect can pick the FTDI radio (ttyUSB1) and
; try to flash through it. The by-id path survives replug / boot order
; changes; ttyUSB{0,1} numbering does not.
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
upload_flags =
    ; Bypass the esptool flasher stub. Its internal watchdog hangs
    ; mid-write on this board / cable combo (~74% in, "chip stopped
    ; responding"). ROM-only flashing is ~3x slower but rock-solid.
    --no-stub
lib_deps =
    ; MissionControl pulls in ServoBus.h which includes <SCServo.h>.
    https://github.com/workloads/scservo.git
    ; GpsLink uses the SparkFun u-blox library to talk to the NEO-M8U
    ; over I2C (SDA=IO8, SCL=IO9).
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.0

; Bench-only build: protocol link on UART0 (CP210x) at 115200 instead
; of the RFD868 radio. Radio init and servo-bus init are compiled out
; so nothing fights over Serial. Use this when you want to drive
; CMD,LEVEL / CMD,PUMP / CMD,STATUS etc. from a host hooked straight
; to the CP210x adapter (no V5 radio in the loop). NOTE: servos are
; unreachable in this mode.
;
; Flash:    pio run -e esp32s3wroom1-uartlink -t upload
; Send:     python3 tools/send_cmd.py -p /dev/ttyUSB0 -b 115200 LEVEL 1
[env:esp32s3wroom1-uartlink]
extends = env:esp32s3wroom1
build_flags =
    ${env:esp32s3wroom1.build_flags}
    -DUART0_PROTOCOL_LINK
upload_flags =
    --no-stub
lib_deps =
    https://github.com/workloads/scservo.git
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.0

; Mock-hardware build for ground-station development.
;
; Same wire format as -uartlink (protocol over CP210x at 115200), but
; the peripheral drivers are stubbed out so the firmware happily runs
; on a bare ESP32-S3 with nothing else connected:
;   - GpsLink synthesizes a fixed fix near Warsaw so collection events
;     have plausible lat/lon and TLM has a live UTC timestamp.
;   - Level sensor is left detached, so Sampler PUMPING uses the 2 s
;     mock timer instead of waiting 30 s for the no-sensor safety cap.
;   - Pumps still toggle their GPIOs (no-ops without a load attached);
;     servos / radio / battery monitor were already disabled in -uartlink.
;
; Flash:  pio run -e esp32s3wroom1-mock -t upload
; Drive:  same as -uartlink — point the GCS at /dev/ttyUSB0 @ 115200.
[env:esp32s3wroom1-mock]
extends = env:esp32s3wroom1-uartlink
build_flags =
    ${env:esp32s3wroom1-uartlink.build_flags}
    -DMOCK_PERIPHERALS
; GpsLink.cpp's mock branch doesn't include SparkFun headers, but the
; library is still pulled by lib_deps so the dep graph matches the
; parent env. (Dead code gets eliminated at link time.)

; Servo-only test build: UART0 dedicated to the SC-09 bus at 1 Mbps,
; everything else (TLM, EVT, BatteryMonitor, RadioLink) compiled out
; so it can't interfere with the half-duplex switching. Debug via JTAG.
; Flash with: pio run -e esp32s3wroom1-servotest -t upload
;
; --no-stub: bypass the esptool flasher stub. The stub has its own
; internal watchdog and can hang mid-flash on some configurations;
; ROM-only flashing is slower (~3x) but much more robust.
;
; lib_deps pulls Waveshare's official SCServo Arduino library so we
; can drive the SC-09 servos using their reference implementation
; rather than our own protocol code.
[env:esp32s3wroom1-servotest]
extends = env:esp32s3wroom1
build_flags =
    ${env:esp32s3wroom1.build_flags}
    -DISOLATE_UART0_FOR_SERVO
upload_flags =
    --no-stub
; upload_port inherits from [env:esp32s3wroom1] — same CP210x adapter.
lib_deps =
    https://github.com/workloads/scservo.git

; Radio bring-up diagnostic build. Talks to the host via CP210x at
; standard 115200 baud (so `pio device monitor` works) and pumps
; periodic counter frames into Serial1 at the radio's baud, auto-
; cycling the TX/RX pin orientation every 5 seconds so a single
; flash exercises both possibilities. Anything received on Serial1
; is echoed back to the CP210x debug log.
;
; Flash:    pio run -e esp32s3wroom1-radiotest -t upload
; Debug:    pio device monitor -p /dev/ttyUSB0 -b 115200
; Radio:    listen on the V5's tty at 57600 for "PING N" lines.
[env:esp32s3wroom1-radiotest]
extends = env:esp32s3wroom1
build_flags =
    ${env:esp32s3wroom1.build_flags}
    -DRADIO_TEST_MODE
lib_deps =
    https://github.com/workloads/scservo.git
